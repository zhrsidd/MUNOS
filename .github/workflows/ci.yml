name: CI
# Every pull request and every push to main must pass the same checks a
# contributor runs locally. Vercel builds Previews independently.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # PostgreSQL 17 from the PostgreSQL project's apt repository, not a container image: Docker Hub and then the
      # public ECR mirror both rate-limited anonymous pulls of postgres:17 and failed CI before any test ran.
      # Port 5433 avoids the runner's preinstalled (stopped) PostgreSQL cluster on 5432.
      - name: Start PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 postgresql-17
          sudo pg_dropcluster --stop 17 main || true
          sudo pg_createcluster 17 ci --port 5433 --start
          sudo -u postgres psql --port 5433 --command "alter user postgres password 'postgres'"
          pg_isready --host 127.0.0.1 --port 5433
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Permission drift (HD4): replays every migration on the PostgreSQL 17 above, fails if docs/generated no longer matches
      # (new function, table, view, default ACL or any privilege change) or if the privilege policy is breached
      # (scripts/isolation-inventory/policy-allowlist.json). Loopback only; creates and drops its own databases.
      - name: Check grants drift
        run: npm run check:grants
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      - run: npm test
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5433/postgres
      - run: npm run build
