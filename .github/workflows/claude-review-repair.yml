name: Claude review repair
# Codex reviews with COMMENTED reviews whose inline threads carry findings, and may submit CHANGES_REQUESTED. Only the
# pinned Codex App (numeric ID 199175422, a Bot) can start a repair, and the gate repeats that check on the current head.
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  repair:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.id == 199175422 &&
      github.event.review.user.type == 'Bot' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-repair-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The gate comes from main once main has it. Before that, stage-gate.sh allows only the owner-pinned bootstrap PR at
      # its pinned tree (see docs/AGENT_AUTOMATION.md). Either way the gate never comes from an arbitrary pull request.
      - name: Check out gate scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: trusted
          persist-credentials: false
      - name: Check out the pull request head for bootstrap staging only
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sparse-checkout: .github/scripts
          path: head
          persist-credentials: false
      - name: Stage gate scripts outside the workspace
        env:
          PR: ${{ github.event.pull_request.number }}
          CODEX_GATE_BOOTSTRAP_PR: ${{ vars.CODEX_GATE_BOOTSTRAP_PR }}
          CODEX_GATE_BOOTSTRAP_TREE: ${{ vars.CODEX_GATE_BOOTSTRAP_TREE }}
        run: |
          set -euo pipefail
          if [ -f trusted/.github/scripts/stage-gate.sh ]; then
            stager=trusted/.github/scripts/stage-gate.sh
          else
            # Bootstrap: verify the head's gate tree here, before any head-supplied script runs.
            if [ -z "$CODEX_GATE_BOOTSTRAP_PR" ] || [ -z "$CODEX_GATE_BOOTSTRAP_TREE" ] || [ "$PR" != "$CODEX_GATE_BOOTSTRAP_PR" ]; then
              echo "::error::main has no gate scripts and no bootstrap is pinned for pull request $PR." >&2
              exit 1
            fi
            tree=$(git -C head rev-parse "HEAD:.github/scripts")
            if [ "$tree" != "$CODEX_GATE_BOOTSTRAP_TREE" ]; then
              echo "::error::Gate tree $tree is not the pinned bootstrap tree; refusing to run the pull request's gate." >&2
              exit 1
            fi
            stager=head/.github/scripts/stage-gate.sh
          fi
          bash "$stager" trusted head "$PR" "$RUNNER_TEMP/gate"
          rm -rf trusted head

      - name: Confirm the review targets the current head and findings remain
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          state=$("$RUNNER_TEMP/gate/codex-review-gate.sh" "$PR")
          echo "$state"
          head=$(jq -r .head_sha <<<"$state")
          if [ "$head" != "$REVIEW_SHA" ]; then
            echo "Review is for $REVIEW_SHA but the head is $head; skipping repair."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r .needs_repair <<<"$state")" != true ]; then
            echo "No unresolved Codex findings on the current head; nothing to repair."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce the three-repair cap
        id: cap
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100" \
            --jq '.[] | select(.commit.message | startswith("fix(review):")) | .sha' | wc -l)
          if [ "$count" -ge 3 ]; then
            body=$(printf 'NEEDS_DECISION: three automated review-repair commits reached. Manual intervention required.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.cap.outcome == 'success'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        if: steps.cap.outcome == 'success'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_AUTOMATION_TOKEN }}
          # Codex is a GitHub App, so the action rejects it unless its exact login is allowed. Nothing else is.
          allowed_bots: "chatgpt-codex-connector[bot]"
          prompt: |
            Address only the unresolved findings from the latest Codex review on PR #${{ github.event.pull_request.number }}
            at commit ${{ github.event.review.commit_id }}. List them with the review threads on that pull request.
            Follow AGENTS.md. Do not change anything under .github/, including the gate scripts and workflows: the gate
            is pinned to a reviewed tree. Do not modify main, hosted Supabase, secrets, Vercel settings or any production
            configuration, and do not run commands against a hosted database.
            For each finding, check it against the code. Fix it when it is actionable and in scope. Otherwise change nothing.
            Run `npm run typecheck`, `npm run lint` and `npm test`, plus any other check the change touches, and say in
            your summary which checks you could not run.
            Commit with a subject starting `fix(review):`, push to the pull request branch, and resolve each thread you fixed.
            Do not force-push. If a finding is ambiguous, unsafe or needs a product decision, leave its thread open and
            comment on the pull request starting `NEEDS_DECISION:` with the reason.

      # Codex does not re-review on its own after a push, so ask for one, once per new head.
      - name: Request a fresh Codex review of the repaired head
        if: steps.cap.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_AUTOMATION_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$head" = "$REVIEW_SHA" ]; then
            echo "No new commit was pushed; not requesting a re-review."
            exit 0
          fi
          marker="<!-- codex-rereview-request sha=$head -->"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --jq '.[].body')
          if grep -qF "$marker" <<<"$existing"; then
            echo "A re-review was already requested for $head."
            exit 0
          fi
          body=$(printf '@codex review\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$marker")
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Requested a Codex re-review of $head."
