name: Claude review repair
# Codex reviews with COMMENTED reviews whose inline threads carry findings, and may submit CHANGES_REQUESTED. Only the
# pinned Codex App (numeric ID 199175422, a Bot) can start a repair, and the gate repeats that check on the current head.
#
# Write safety. Claude runs in the `repair` job with a read-only contents token and no push credential, so it cannot push
# even if it ignores its instructions. The job only hands back a patch. The `push` job runs on a fresh runner, applies the
# patch to the reviewed commit, refuses any change to a protected path, and is the only place the push token is used.
# See CLAUDE.md and docs/AGENT_AUTOMATION.md for the protected-path list.
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  repair:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.id == 199175422 &&
      github.event.review.user.type == 'Bot' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-repair-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # No contents: write, no secret that can push, and no pull-requests: write: this job runs Claude with a shell, and
    # pull-requests: write would let it resolve a human's review thread or dismiss a review that the gate relies on.
    # issues: write is enough for the NEEDS_DECISION comments. There is no id-token: write, so the action cannot exchange
    # for the write-capable Claude App token either.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
      thread_ids: ${{ steps.capture.outputs.thread_ids }}
    steps:
      # The gate comes from main once main has it. Before that, stage-gate.sh allows only the owner-pinned bootstrap PR at
      # its pinned tree (see docs/AGENT_AUTOMATION.md). Either way the gate never comes from an arbitrary pull request.
      - name: Check out gate scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: trusted
          persist-credentials: false
      - name: Check out the pull request head for bootstrap staging only
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          sparse-checkout: .github/scripts
          path: head
          persist-credentials: false
      - name: Stage gate scripts outside the workspace
        env:
          PR: ${{ github.event.pull_request.number }}
          CODEX_GATE_BOOTSTRAP_PR: ${{ vars.CODEX_GATE_BOOTSTRAP_PR }}
          CODEX_GATE_BOOTSTRAP_TREE: ${{ vars.CODEX_GATE_BOOTSTRAP_TREE }}
        run: |
          set -euo pipefail
          if [ -f trusted/.github/scripts/stage-gate.sh ]; then
            stager=trusted/.github/scripts/stage-gate.sh
          else
            # Bootstrap: verify the head's gate tree here, before any head-supplied script runs.
            if [ -z "$CODEX_GATE_BOOTSTRAP_PR" ] || [ -z "$CODEX_GATE_BOOTSTRAP_TREE" ] || [ "$PR" != "$CODEX_GATE_BOOTSTRAP_PR" ]; then
              echo "::error::main has no gate scripts and no bootstrap is pinned for pull request $PR." >&2
              exit 1
            fi
            tree=$(git -C head rev-parse "HEAD:.github/scripts")
            if [ "$tree" != "$CODEX_GATE_BOOTSTRAP_TREE" ]; then
              echo "::error::Gate tree $tree is not the pinned bootstrap tree; refusing to run the pull request's gate." >&2
              exit 1
            fi
            stager=head/.github/scripts/stage-gate.sh
          fi
          bash "$stager" trusted head "$PR" "$RUNNER_TEMP/gate"
          rm -rf trusted head

      - name: Confirm the review targets the current head and findings remain
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          state=$("$RUNNER_TEMP/gate/codex-review-gate.sh" "$PR")
          echo "$state"
          head=$(jq -r .head_sha <<<"$state")
          if [ "$head" != "$REVIEW_SHA" ]; then
            echo "Review is for $REVIEW_SHA but the head is $head; skipping repair."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$(jq -r .needs_repair <<<"$state")" != true ]; then
            echo "No unresolved Codex findings on the current head; nothing to repair."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce the three-repair cap
        id: cap
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits?per_page=100" \
            --jq '.[] | select(.commit.message | startswith("fix(review):")) | .sha' | wc -l)
          if [ "$count" -ge 3 ]; then
            body=$(printf 'NEEDS_DECISION: three automated review-repair commits reached. Manual intervention required.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_')
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi

      # Before Claude runs, record which review threads this repair answers: the open threads whose first comment is a Codex
      # comment of the very review that triggered this run. The push job resolves only these, so a newer Codex review, an
      # older one or a human's thread is never closed by it. If the list cannot be established, Claude does not run.
      - name: Capture the Codex threads of the review being repaired
        id: capture
        if: steps.cap.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        run: |
          set -euo pipefail
          if ! [[ "$REVIEW_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The review ID is not numeric; not running the repair." >&2
            exit 1
          fi
          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY##*/}
          codex_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments?per_page=100" --jq '.[]' \
            | jq -sc --argjson review "$REVIEW_ID" '[.[]
                | select(.user.id == 199175422 and .user.login == "chatgpt-codex-connector[bot]" and .user.type == "Bot")
                | select(.pull_request_review_id == $review) | .id]')
          # The $variables below are GraphQL's, so they must stay unexpanded.
          # shellcheck disable=SC2016
          query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { reviewThreads(first: 100) { pageInfo { hasNextPage } nodes { id isResolved comments(first: 1) { nodes { databaseId } } } } } } }'
          page=$(gh api graphql -f query="$query" -F owner="$owner" -F name="$name" -F number="$PR")
          if [ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$page")" = true ]; then
            echo "::error::More than 100 review threads; cannot establish which belong to this review." >&2
            exit 1
          fi
          ids=$(jq -c --argjson codex "$codex_ids" '[
            .data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved | not)
            | select(.comments.nodes[0].databaseId as $c | any($codex[]; . == $c))
            | .id]' <<<"$page")
          echo "thread_ids=$ids" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.capture.outcome == 'success'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        if: steps.capture.outcome == 'success'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token is read-only for contents. Passing it explicitly also stops the action from exchanging for
          # the Claude GitHub App token, which has write access. Claude therefore cannot push from this job.
          github_token: ${{ github.token }}
          # Codex is a GitHub App, so the action rejects it unless its exact login is allowed. Nothing else is.
          allowed_bots: "chatgpt-codex-connector[bot]"
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm run typecheck),Bash(npm run lint),Bash(npm test:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api graphql:*)"
            --disallowedTools "Bash(git push:*),Bash(git remote:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            Address only the unresolved findings from the latest Codex review on PR #${{ github.event.pull_request.number }}
            at commit ${{ github.event.review.commit_id }}. List them with the review threads on that pull request.
            Follow AGENTS.md and the "Protected paths in automated review repairs" section of CLAUDE.md. Do not change
            anything under .github/, CLAUDE.md, AGENTS.md or any other protected path: a separate job rejects the whole patch
            if it touches one. Do not modify main, hosted Supabase, secrets, Vercel settings or any production configuration,
            and do not run commands against a hosted database.
            For each finding, check it against the code. Fix it when it is actionable and in scope. Otherwise change nothing.
            Run `npm run typecheck`, `npm run lint` and `npm test`, plus any other check the change touches, and say in
            your summary which checks you could not run.
            Edit files only. Do not commit or push: the workflow turns your edits into a commit and publishes it after checking
            them. Do not resolve or dismiss any review or thread: the workflow resolves Codex's own threads after a push, and
            Codex's next review decides whether each finding is fixed. If a finding is ambiguous, unsafe, needs a product
            decision or needs a change to a protected path, change nothing for it and comment on the pull request starting
            `NEEDS_DECISION:` with the reason.

      - name: Collect Claude's edits as a patch
        id: patch
        if: steps.capture.outcome == 'success'
        env:
          BASE: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          git add -A

          # The action itself restores CLAUDE.md, .claude, .mcp.json and similar files from main and writes .claude-pr/, so a
          # plain diff would carry those changes and the push job would refuse every repair. Drop every protected path here
          # and say so. This is a convenience, not the guard: Claude has a shell in this job, so the push job re-checks the
          # patch on a fresh runner and refuses the whole patch if a protected path still arrives.
          # Paths are compared in lower case with a leading slash, so a dot segment is "/." and a basename is "/name".
          protected() {
            local p="/${1,,}"
            case "$p" in
              */.*|*/claude.md|*/agents.md) return 0 ;;
              /supabase/*|/scripts/isolation-inventory/*|/scripts/vercel-ignore-build.sh) return 0 ;;
              /vercel.json|/package.json|/package-lock.json|/npm-shrinkwrap.json|/yarn.lock|/pnpm-lock.yaml|/bun.lock|/bun.lockb) return 0 ;;
              /next.config.*|/eslint.config.*|/tsconfig*.json) return 0 ;;
              /lib/platform/target-guard.ts|/config/project-lifecycle.json|/docs/agent_automation.md) return 0 ;;
            esac
            return 1
          }
          mapfile -d '' changed < <(git diff --cached --name-only -z --no-renames "$BASE")
          for path in "${changed[@]}"; do
            if protected "$path"; then
              git reset -q "$BASE" -- "$path"
              printf -v shown '%q' "$path"
              echo "::warning::Dropped the change to protected path $shown; it will not be pushed."
            fi
          done

          git diff --cached --binary --no-renames "$BASE" > "$RUNNER_TEMP/repair.patch"
          if [ -s "$RUNNER_TEMP/repair.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "No edits were made; nothing to publish."
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hand the patch to the push job
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repair-patch
          path: ${{ runner.temp }}/repair.patch
          if-no-files-found: error
          retention-days: 1

  push:
    needs: repair
    if: needs.repair.result == 'success' && needs.repair.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-push-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: repair-patch
          path: ${{ runner.temp }}/patch

      # The patch is untrusted data. This step applies it to the reviewed commit and judges the result, not the patch headers.
      # It holds no push credential. Keep the protected list in step with CLAUDE.md and docs/AGENT_AUTOMATION.md.
      - name: Apply the patch and check every changed file
        id: apply
        env:
          BASE: ${{ github.event.review.commit_id }}
          PATCH: ${{ runner.temp }}/patch/repair.patch
        run: |
          set -euo pipefail
          git config user.name "claude-review-repair"
          git config user.email "claude-review-repair@users.noreply.github.com"
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "::error::The checkout is not the reviewed commit; refusing." >&2
            exit 1
          fi
          size=$(wc -c < "$PATCH")
          if [ "$size" -gt 2000000 ]; then
            echo "::error::The patch is $size bytes; refusing anything over 2000000." >&2
            exit 1
          fi
          if ! git apply --index --binary "$PATCH"; then
            echo "::error::The patch does not apply cleanly to the reviewed commit; refusing." >&2
            exit 1
          fi

          # Paths are compared in lower case with a leading slash, so a dot segment is "/." and a basename is "/name".
          protected() {
            local p="/${1,,}"
            case "$p" in
              */.*|*/claude.md|*/agents.md) return 0 ;;
              /supabase/*|/scripts/isolation-inventory/*|/scripts/vercel-ignore-build.sh) return 0 ;;
              /vercel.json|/package.json|/package-lock.json|/npm-shrinkwrap.json|/yarn.lock|/pnpm-lock.yaml|/bun.lock|/bun.lockb) return 0 ;;
              /next.config.*|/eslint.config.*|/tsconfig*.json) return 0 ;;
              /lib/platform/target-guard.ts|/config/project-lifecycle.json|/docs/agent_automation.md) return 0 ;;
            esac
            return 1
          }

          # Raw, NUL-separated, no rename detection: a rename shows as a delete plus an add, so both paths are checked.
          violations=0
          entries=0
          while IFS= read -r -d '' meta; do
            IFS= read -r -d '' path
            entries=$((entries + 1))
            read -r srcmode dstmode _ _ status <<<"${meta#:}"
            reason=""
            case "$status" in A|M|D) ;; *) reason="unsupported change type $status" ;; esac
            if [ "$status" != D ] && [ "$dstmode" != 100644 ]; then reason="symlink, submodule or executable file"; fi
            if [ "$status" = M ] && [ "$srcmode" != "$dstmode" ]; then reason="file mode change"; fi
            if protected "$path"; then reason="protected path"; fi
            if [ -n "$reason" ]; then
              printf -v shown '%q' "$path"
              echo "::error::Refusing $shown ($reason)." >&2
              violations=$((violations + 1))
            fi
          done < <(git diff --cached --raw -z --no-renames "$BASE")

          if [ "$violations" -gt 0 ]; then
            echo "::error::$violations change(s) refused; nothing was pushed." >&2
            exit 1
          fi
          if [ "$entries" -eq 0 ]; then
            echo "The patch changes nothing; not pushing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "fix(review): apply the automated Codex review repair" \
            -m "Every changed path was checked against the protected-path list before this commit was pushed."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The only step that holds the push token, and it runs only after the check above has passed.
      - name: Push the checked repair
        id: push
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_AUTOMATION_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_REF" ] || [ "$HEAD_REF" = main ]; then
            echo "::error::Refusing to push to the branch '$HEAD_REF'." >&2
            exit 1
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_sha=$(git ls-remote "$remote" "refs/heads/$HEAD_REF" | cut -f1)
          if [ "$remote_sha" != "$BASE" ]; then
            echo "::error::The branch is at '$remote_sha', not the reviewed commit; nothing was pushed." >&2
            exit 1
          fi
          git push "$remote" "HEAD:refs/heads/$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Claude cannot resolve threads, so the workflow does it. It resolves only the threads captured before Claude ran (the
      # open Codex threads of the review being repaired) and checks each one again here: still open, still opened by the
      # pinned Codex App (numeric ID) in that same review. Human threads, threads of a newer or older review and anything
      # that cannot be verified stay open. Codex's fresh review of the new head still decides.
      - name: Resolve the Codex review threads
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_AUTOMATION_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          THREAD_IDS: ${{ needs.repair.outputs.thread_ids }}
        run: |
          set -euo pipefail
          if ! [[ "$REVIEW_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The review ID is not numeric; not resolving any thread." >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length <= 100 and all(.[]; type == "string" and test("^PRRT_[A-Za-z0-9_-]+$"))' <<<"$THREAD_IDS" >/dev/null 2>&1; then
            echo "::error::The captured thread list is missing or malformed; not resolving any thread." >&2
            exit 1
          fi
          if [ "$(jq 'length' <<<"$THREAD_IDS")" -eq 0 ]; then
            echo "The repaired review has no open Codex threads to resolve."
            exit 0
          fi
          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY##*/}
          codex_ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments?per_page=100" --jq '.[]' \
            | jq -sc --argjson review "$REVIEW_ID" '[.[]
                | select(.user.id == 199175422 and .user.login == "chatgpt-codex-connector[bot]" and .user.type == "Bot")
                | select(.pull_request_review_id == $review) | .id]')
          # The $variables below are GraphQL's, so they must stay unexpanded.
          # shellcheck disable=SC2016
          query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { reviewThreads(first: 100) { pageInfo { hasNextPage } nodes { id isResolved comments(first: 1) { nodes { databaseId } } } } } } }'
          page=$(gh api graphql -f query="$query" -F owner="$owner" -F name="$name" -F number="$PR")
          if [ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$page")" = true ]; then
            echo "::error::More than 100 review threads; not resolving any." >&2
            exit 1
          fi
          mapfile -t ids < <(jq -r --argjson codex "$codex_ids" --argjson captured "$THREAD_IDS" '
            .data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved | not)
            | select(.id as $t | any($captured[]; . == $t))
            | select(.comments.nodes[0].databaseId as $c | any($codex[]; . == $c))
            | .id' <<<"$page")
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "No captured Codex thread is still open; nothing to resolve."
            exit 0
          fi
          for id in "${ids[@]}"; do
            # shellcheck disable=SC2016
            gh api graphql -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { id } } }' -f id="$id" >/dev/null
            echo "Resolved one Codex thread."
          done

      # Codex does not re-review on its own after a push, so ask for one, once per new head. This runs after the threads are
      # resolved: resolving fires no event the gate listens to, so a clean re-review that arrived first would leave the gate
      # red on threads about to be closed. It runs even if the resolver failed, so that a bookkeeping failure cannot stall the loop. The commit comes from the push
      # step, never from GET /pulls/N: GitHub updates a pull request's head a moment after a push, and a read straight after
      # it can still return the old commit, which once made this step skip the request without a word.
      - name: Request a fresh Codex review of the repaired head
        if: always() && steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_AUTOMATION_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
          PUSHED_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PUSHED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The push step reported no commit SHA; not requesting a re-review." >&2
            exit 1
          fi
          if [ "$PUSHED_SHA" = "$REVIEW_SHA" ]; then
            echo "No new commit was pushed; not requesting a re-review."
            exit 0
          fi
          marker="<!-- codex-rereview-request sha=$PUSHED_SHA -->"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --jq '.[].body')
          if grep -qF "$marker" <<<"$existing"; then
            echo "A re-review was already requested for $PUSHED_SHA."
            exit 0
          fi
          body=$(printf '@codex review\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$marker")
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          echo "Requested a Codex re-review of $PUSHED_SHA."
