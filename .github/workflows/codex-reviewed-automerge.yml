name: Codex reviewed auto-merge
# This workflow is a gate, not a trigger. Every event re-reads Codex's summary state for the current head, its
# unresolved threads and the main ruleset, then enables auto-merge only when all of them are clear. Otherwise it
# cancels auto-merge. A comment or review alone never enables it.
on:
  pull_request_review:
    # dismissed: removing a blocking review must re-evaluate the head, or a stale failing status stays in place.
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    # Codex's summary comment is the only comment that counts, and only from its pinned identity.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.id == 199175422 &&
       github.event.comment.user.type == 'Bot' &&
       contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->'))
    steps:
      - name: Validate event target or discover reconciliation candidates
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              result = subprocess.run(['gh', 'api', '--paginate', '--slurp',
                  'repos/' + os.environ['GITHUB_REPOSITORY'] + '/pulls?state=open&base=main&per_page=100'],
                  check=True, capture_output=True, text=True)
              prs = [p['number'] for page in json.loads(result.stdout) for p in page
                  if not p['draft'] and p['head']['repo']
                  and p['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']]
          else:
              raw = (os.environ.get('MANUAL_PR', '') if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                  else str(event.get('pull_request', {}).get('number') or event.get('issue', {}).get('number', '')))
              if not re.fullmatch(r'[0-9]{1,10}', raw) or not 0 < int(raw) <= 2147483647:
                  raise SystemExit('::error::Invalid manual input or event PR identifier: use a positive integer (for example 84).')
              prs = [int(raw)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prs=' + json.dumps(sorted(set(prs))) + '\n')
          PYTHON

  evaluate:
    needs: select
    if: needs.select.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    # Both event and scheduled evaluations use the NORMALISED PR number and the same lock.
    concurrency:
      group: codex-merge-gate-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # The gate logic comes from main, not from the pull request, so a PR cannot weaken its own gate. If main has no gate
      # scripts the workflow fails closed.
      - name: Check out gate scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: trusted
          persist-credentials: false
      - name: Stage gate scripts outside the workspace
        run: |
          set -euo pipefail
          if [ ! -f trusted/.github/scripts/codex-review-gate.sh ]; then
            echo "::error::main has no gate scripts; refusing to run." >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/gate"
          cp -r trusted/.github/scripts "$RUNNER_TEMP/gate"
          rm -rf trusted

      - name: Decide from Codex's structured state on the current head
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          state=$("$RUNNER_TEMP/gate/codex-review-gate.sh" "$PR")
          echo "$state"
          echo "### PR $PR gate evaluation" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.reasons[] | "- " + .' <<<"$state" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"ready=\(.ready_to_merge)\nhead=\(.head_sha)"' <<<"$state" >> "$GITHUB_OUTPUT"

      # The ruleset requires this status on the head, so GitHub itself blocks a merge of any head Codex has not cleared,
      # even when the cancellation below has not run yet.
      - name: Publish the gate decision as a commit status on the head
        env:
          GH_TOKEN: ${{ github.token }}
          READY: ${{ steps.gate.outputs.ready }}
          HEAD: ${{ steps.gate.outputs.head }}
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          current=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$HEAD" ]; then
            echo "::error::Stale evaluation: head changed; reconciliation will retry."
            exit 1
          fi
          if [ "$READY" = true ]; then state=success; else state=failure; fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/status" \
            --jq '[.statuses[] | select(.context == "codex-review-gate")][0].state // "missing"')
          if [ "$previous" = "$state" ]; then
            echo "Gate status already $state on $HEAD; no duplicate status needed."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$state" \
            -f context=codex-review-gate -f "description=Codex gate: $state; see Actions diagnostics" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Enable auto-merge only for a clear head, otherwise cancel it
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
          READY: ${{ steps.gate.outputs.ready }}
          HEAD: ${{ steps.gate.outputs.head }}
        run: |
          set -euo pipefail
          current=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          enabled=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$READY" = true ] && [ "$current" = "$HEAD" ]; then
            if [ "$enabled" = true ]; then
              echo "Auto-merge is already enabled for $HEAD."
            else
              # --match-head-commit makes GitHub refuse the enable if the head moved after the check above.
              if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch --match-head-commit "$HEAD"; then
                echo "::error::Failed to enable guarded squash auto-merge; check token permissions and repository settings."
                exit 1
              fi
              echo "Enabled auto-merge for $HEAD. Branch protection still requires verify to pass."
            fi
          elif [ "$current" != "$HEAD" ]; then
            echo "::error::Stale evaluation before auto-merge; reconciliation required."
            exit 1
          elif [ "$enabled" = true ]; then
            if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; then
              echo "::error::Failed to cancel auto-merge; owner intervention required."
              exit 1
            fi
            echo "Cancelled auto-merge: the gate is not clear on the current head."
          else
            echo "Not ready; auto-merge stays off."
          fi

      # A failed evaluation must never leave an earlier enablement or success status in place. Runs only after a failure above.
      - name: Fail the gate status and cancel auto-merge when the evaluation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr }}
        run: |
          echo "::error::Gate evaluation, GitHub API/authentication, or auto-merge operation failed. See the failed step; gate remains blocking."
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid || echo "")
          if [ -n "$head" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$head" -f state=failure \
              -f context=codex-review-gate -f "description=Codex review gate: evaluation failed" >/dev/null \
              || echo "::error::Could not publish a failing gate status on $head."
          fi
          enabled=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null' || echo unknown)
          if [ "$enabled" != false ] && ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; then
            echo "::error::Could not cancel auto-merge on PR $PR; cancel it manually before anything else merges."
            exit 1
          fi
